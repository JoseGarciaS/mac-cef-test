name: macos-cefsimple

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-cefsimple:
    runs-on: macos-15-intel

    env:
      CEF_DOWNLOAD_URL: https://cef-builds.spotifycdn.com/cef_binary_148.0.9%2Bg0d9d52a%2Bchromium-148.0.7778.180_macosx64.tar.bz2

    steps:
      - name: Download CEF binary distribution
        run: |
          set -euo pipefail

          archive_file="cef_binary_macosx64.tar.bz2"
          curl -fsSL "$CEF_DOWNLOAD_URL" -o "$archive_file"

          top_dir="$(tar -tjf "$archive_file" | head -n 1 | cut -d/ -f1)"
          tar -xjf "$archive_file"

          echo "CEF_SOURCE_DIR=$PWD/$top_dir" >> "$GITHUB_ENV"
          echo "CEF_BUILD_DIR=$PWD/$top_dir/build" >> "$GITHUB_ENV"

          rm -f "$archive_file"

      - name: Configure CMake
        run: |
          cmake -S "$CEF_SOURCE_DIR" -B "$CEF_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROJECT_ARCH=x86_64

      - name: Build libcef_dll_wrapper
        run: |
          cmake --build "$CEF_BUILD_DIR" --target libcef_dll_wrapper

      - name: Build cefsimple
        run: |
          cmake --build "$CEF_BUILD_DIR" --target cefsimple

      - name: Collect app bundle
        run: |
          mkdir -p artifacts
          cp -R "$CEF_BUILD_DIR/tests/cefsimple/Release/cefsimple.app" artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cefsimple-macos-app
          path: artifacts/cefsimple.app
